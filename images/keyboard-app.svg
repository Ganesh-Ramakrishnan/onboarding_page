<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="kbBg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E24E12"/>
    </linearGradient>
    <linearGradient id="kbGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="58" fill="url(#kbBg)"/>
  <!-- top gloss -->
  <rect width="256" height="150" rx="58" fill="url(#kbGloss)"/>

  <!-- keyboard body -->
  <rect x="44" y="82" width="168" height="96" rx="20"
        fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>

  <!-- keys -->
  <g fill="#FFFFFF">
    <!-- row 1 -->
    <rect x="64"  y="104" width="18" height="15" rx="4.5"/>
    <rect x="91"  y="104" width="18" height="15" rx="4.5"/>
    <rect x="118" y="104" width="18" height="15" rx="4.5"/>
    <rect x="145" y="104" width="18" height="15" rx="4.5"/>
    <rect x="172" y="104" width="18" height="15" rx="4.5"/>
    <!-- row 2: side keys + spacebar -->
    <rect x="64"  y="140" width="18" height="15" rx="4.5"/>
    <rect x="91"  y="140" width="72" height="15" rx="7.5"/>
    <rect x="172" y="140" width="18" height="15" rx="4.5"/>
  </g>
</svg>
